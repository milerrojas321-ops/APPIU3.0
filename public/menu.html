<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appiu | Comunidad Botánica</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        :root {
            --primary: #1a4d2e;
            --primary-light: #eefdf5;
            --accent: #ff4d94;
            --bg: #f0f4f2;
            --white: #ffffff;
            --text: #0d2117;
            --text-light: #5c7167;
            --sidebar-width: 280px;
            --right-panel-width: 320px;
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.05);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; overflow-x: hidden; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width); height: 100vh; background: var(--white);
            position: fixed; padding: 40px 25px; display: flex; flex-direction: column;
            border-right: 1px solid rgba(0,0,0,0.06); z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 50px; }
        .logo-img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
        .logo-text { font-size: 1.8rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }

        .nav-menu { list-style: none; flex-grow: 1; }
        .nav-item { 
            padding: 16px 20px; border-radius: 16px; margin-bottom: 10px;
            cursor: pointer; transition: 0.3s; color: var(--text-light);
            display: flex; align-items: center; gap: 18px; font-weight: 600;
        }
        .nav-item:hover { background: var(--primary-light); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; }

        /* CONTENIDO PRINCIPAL */
        main { 
            margin-left: var(--sidebar-width); 
            margin-right: var(--right-panel-width);
            width: 100%; padding: 40px; display: flex; flex-direction: column; align-items: center; 
        }

        /* BANNER HERO */
        .hero-banner {
            width: 100%; max-width: 700px; height: 180px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-position: center;
            border-radius: 30px; margin-bottom: 40px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; padding: 20px;
            box-shadow: 0 15px 35px rgba(26, 77, 46, 0.2);
        }
        .hero-banner h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .hero-banner p { font-style: italic; opacity: 0.9; font-size: 1rem; }

        .feed-container { max-width: 600px; width: 100%; }

        /* SUGERENCIAS (DERECHA) */
        .right-panel {
            width: var(--right-panel-width); height: 100vh;
            position: fixed; right: 0; padding: 40px 25px;
            background: var(--bg); border-left: 1px solid rgba(0,0,0,0.05);
        }
        .suggestions-card {
            background: var(--white); border-radius: 24px; padding: 25px;
            box-shadow: var(--shadow-soft);
        }
        .suggestions-card h3 { font-size: 1.1rem; margin-bottom: 20px; color: var(--primary); }
        
        .user-suggest { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .user-suggest-info { display: flex; align-items: center; gap: 10px; }
        .user-suggest img { width: 35px; height: 35px; border-radius: 10px; background: #eee; }
        .btn-follow { 
            color: var(--primary); font-weight: 800; font-size: 0.85rem; 
            cursor: pointer; border: none; background: none; 
        }

        /* POST CARD */
        .post-card {
            background: var(--white); border-radius: 32px; margin-bottom: 40px;
            box-shadow: var(--shadow-soft); overflow: hidden;
        }
        .post-header { padding: 20px 25px; display: flex; align-items: center; gap: 15px; }
        .user-pfp { width: 48px; height: 48px; border-radius: 18px; object-fit: cover; }
        .post-image { width: 100%; max-height: 550px; object-fit: cover; display: block; }
        .post-body { padding: 25px; }
        .post-footer { padding: 0 25px 25px; display: flex; gap: 30px; }

        /* PANEL COMENTARIOS */
        .comments-panel {
            position: fixed; right: -400px; top: 0; width: 400px; height: 100vh;
            background: white; z-index: 1000; transition: 0.4s;
            box-shadow: -10px 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        .comments-panel.active { right: 0; }
        .comments-header { padding: 25px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; }
        .comments-list { flex-grow: 1; overflow-y: auto; padding: 20px; }

        /* MODAL */
        .modal {
            display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 33, 23, 0.8); backdrop-filter: blur(8px); align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 40px; border-radius: 35px; width: 90%; max-width: 550px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="./img/Logo para Joyería Minimalista Neutral.jpg" alt="" class="logo-img"> 
            <div class="logo-text">Appiu</div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item active"><i class="fa-solid fa-house"></i> Inicio</li>
            <li class="nav-item" onclick="location.href='plantas.html'"><i class="fa-solid fa-compass"></i> Explorar plantas</li>
            <li class="nav-item"><i class="fa-solid fa-leaf"></i> Mi Jardín</li>
            <li class="nav-item" onclick="location.href='perfil.html'"><i class="fa-solid fa-user"></i> Mi Perfil</li>
            <li class="nav-item" onclick="logout()" style="margin-top: auto; color: #ff6b6b;"><i class="fa-solid fa-right-from-bracket"></i> Salir</li>
        </ul>
        <button style="background: var(--primary); color:white; border:none; padding:18px; border-radius:20px; font-weight:800; cursor:pointer;" onclick="openModal()">
            <i class="fa-solid fa-plus-circle"></i> Publicar
        </button>
    </aside>

    <main>
        <div class="hero-banner">
            <h1>Plantar es creer en el mañana</h1>
            <p>"La naturaleza no hace nada incompleto, ni nada en vano"</p>
        </div>

        <div class="feed-container" id="feed-dinamico"></div>
    </main>

    <div class="right-panel">
        <div class="suggestions-card">
            <h3>Sugerencias para ti</h3>
            <div id="lista-sugerencias">
                </div>
        </div>
        <p style="font-size: 0.75rem; color: #888; margin-top: 20px; padding: 0 10px;">
            © 2024 Appiu de Tecnólogo. <br> Donde cada brote cuenta una historia.
        </p>
    </div>

    <div class="comments-panel" id="commentsPanel">
        <div class="comments-header">
            <h3>Comentarios</h3>
            <i class="fa-solid fa-xmark" onclick="closeComments()" style="cursor:pointer;"></i>
        </div>
        <div class="comments-list" id="commentsList"></div>
        <form style="padding:20px; border-top:1px solid #eee; display:flex; gap:10px;" id="form-comentario">
            <input type="text" id="comment-text" placeholder="Escribe algo..." required style="flex-grow:1; border:none; background:#f0f4f2; padding:12px; border-radius:20px; outline:none;">
            <button type="submit" style="background:none; border:none; color:var(--primary); font-weight:800; cursor:pointer;">Enviar</button>
        </form>
    </div>

    <div class="modal" id="modalPost">
        <div class="modal-content">
            <h2 style="margin-bottom: 25px; color: var(--primary);">Compartir un Brote</h2>
            <form id="form-publicar">
                <input type="text" id="plant-name" placeholder="Nombre de tu planta" required style="width:100%; padding:15px; margin-bottom:15px; border-radius:15px; border:1px solid #eee;">
                <textarea id="post-content" placeholder="¿Qué quieres contarnos?" required style="width:100%; height:120px; padding:15px; margin-bottom:15px; border-radius:15px; border:1px solid #eee; resize:none;"></textarea>
                <input type="file" id="image-file" accept="image/*" required style="margin-bottom:20px;">
                <button type="submit" style="background:var(--primary); color:white; border:none; padding:15px; border-radius:15px; width:100%; font-weight:800; cursor:pointer;">Publicar 🌿</button>
            </form>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));
        if(!user) window.location.href = "login.html";

        let currentPostId = null;

        function openModal() { document.getElementById('modalPost').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalPost').style.display = 'none'; }
        function closeComments() { document.getElementById('commentsPanel').classList.remove('active'); }

        async function cargarFeed() {
            const feed = document.getElementById("feed-dinamico");
            try {
                const res = await fetch("/api/publicaciones");
                const posts = await res.json();
                feed.innerHTML = "";
                posts.forEach(post => {
                    feed.innerHTML += `
                        <article class="post-card">
                            <div class="post-header">
                                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${post.username}" class="user-pfp">
                                <div><b>${post.username}</b><small style="color:#888; display:block; font-size:0.75rem;">${new Date(post.created_at).toLocaleDateString()}</small></div>
                            </div>
                            <img src="${post.image_url}" class="post-image">
                            <div class="post-body">
                                <h4 style="color:var(--primary)">🌿 ${post.plant_name}</h4>
                                <p>${post.content}</p>
                            </div>
                            <div class="post-footer">
                                <div onclick="darLike(${post.id})" style="cursor:pointer; font-weight:800;"><i class="fa-solid fa-heart"></i> ${post.likes || 0}</div>
                                <div onclick="abrirComentarios(${post.id})" style="cursor:pointer; font-weight:800;"><i class="fa-solid fa-comment"></i> Comentar</div>
                            </div>
                        </article>
                    `;
                });
            } catch (e) { feed.innerHTML = "Error al cargar."; }
        }

        async function cargarSugerencias() {
    const lista = document.getElementById("lista-sugerencias");
    try {
        const res = await fetch("/api/usuarios"); 
        const usuarios = await res.json();
        
        lista.innerHTML = ""; // Limpiamos el cargando
        
        // Filtramos para que NO aparezcas tú mismo en las sugerencias
        const otrosUsuarios = usuarios.filter(u => u.username !== user.username);

        // Si no hay otros usuarios todavía
        if (otrosUsuarios.length === 0) {
            lista.innerHTML = "<p style='font-size:0.8rem; color:grey;'>No hay más brotes por ahora...</p>";
            return;
        }

        // Mostramos máximo 5 sugerencias de forma aleatoria o los primeros
        otrosUsuarios.slice(0, 5).forEach(u => {
            lista.innerHTML += `
                <div class="user-suggest" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                    <div class="user-suggest-info" style="display: flex; align-items: center; gap: 10px;">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${u.username}" style="width: 35px; height: 35px; border-radius: 10px; background: #eee;">
                        <b style="font-size:0.85rem;">${u.username}</b>
                    </div>
                    <button class="btn-follow" onclick="followUser(${u.id})">Seguir</button>
                </div>
            `;
        });
    } catch (e) {
        console.error("Error cargando sugerencias:", e);
        lista.innerHTML = "<p>Error al cargar usuarios</p>";
    }
}

        async function abrirComentarios(postId) {
            currentPostId = postId;
            document.getElementById('commentsPanel').classList.add('active');
            cargarComentarios(postId);
        }

        async function cargarComentarios(postId) {
            const list = document.getElementById('commentsList');
            list.innerHTML = "Cargando...";
            const res = await fetch(`/api/publicaciones/${postId}/comentarios`);
            const comments = await res.json();
            list.innerHTML = "";
            comments.forEach(c => {
                list.innerHTML += `<div style="margin-bottom:15px;"><b style="font-size:0.85rem;">${c.username}</b><p style="font-size:0.9rem;">${c.texto}</p></div>`;
            });
        }

        document.getElementById('form-comentario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const texto = document.getElementById('comment-text').value;
            await fetch(`/api/publicaciones/${currentPostId}/comentario`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: user.id, username: user.username, texto })
            });
            document.getElementById('comment-text').value = "";
            cargarComentarios(currentPostId);
        });

        document.getElementById('form-publicar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('username', user.username);
            formData.append('plant_name', document.getElementById('plant-name').value);
            formData.append('content', document.getElementById('post-content').value);
            formData.append('image', document.getElementById('image-file').files[0]);

            await fetch('/api/publicaciones/crear', { method: 'POST', body: formData });
            closeModal();
            cargarFeed();
        });

        async function darLike(postId) {
            await fetch(`/api/publicaciones/${postId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id })
            });
            cargarFeed();
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        
        cargarFeed();
        cargarSugerencias();

        async function followUser(seguidoId) {
    try {
        const res = await fetch('/api/usuarios/follow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                seguidor_id: user.id, 
                seguido_id: seguidoId 
            })
        });

        if (res.ok) {
            const data = await res.json();
            
            // Esto refresca la lista de sugerencias. 
            // Si tu backend está bien hecho, el usuario ya no saldrá o saldrá con el texto correcto.
            cargarSugerencias(); 
            
            // Si quieres un cambio instantáneo sin recargar toda la lista:
            // let btn = event.target; 
            // btn.innerText = data.action === 'followed' ? 'Seguido' : 'Seguir';
        }
    } catch (error) {
        console.error("Error al conectar:", error);
    }
}

    </script>
</body>
</html>
